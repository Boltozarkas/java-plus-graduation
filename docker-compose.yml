services:
  # ==================== KAFKA ====================
  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'
    networks:
      - ewm-network

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: "bash -c \
                'kafka-topics --create --topic stats.user-actions.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic stats.events-similarity.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092'"
    init: true
    networks:
      - ewm-network

  # ==================== БАЗЫ ДАННЫХ ====================
  users-db:
    image: postgres:16.1
    container_name: users-db
    ports:
      - "7543:5432"
    environment:
      POSTGRES_DB: ewm-users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ewm-network

  events-db:
    image: postgres:16.1
    container_name: events-db
    ports:
      - "7544:5432"
    environment:
      POSTGRES_DB: ewm-events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    volumes:
      - events-db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ewm-network

  requests-db:
    image: postgres:16.1
    container_name: requests-db
    ports:
      - "7545:5432"
    environment:
      POSTGRES_DB: ewm-requests
      POSTGRES_USER: requests
      POSTGRES_PASSWORD: requests
    volumes:
      - requests-db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ewm-network

  comments-db:
    image: postgres:16.1
    container_name: comments-db
    ports:
      - "7546:5432"
    environment:
      POSTGRES_DB: ewm-comments
      POSTGRES_USER: comments
      POSTGRES_PASSWORD: comments
    volumes:
      - comments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ewm-network

  analyzer-db:
    image: postgres:16.1
    container_name: analyzer-db
    ports:
      - "7547:5432"
    environment:
      POSTGRES_DB: ewm-analyzer
      POSTGRES_USER: analyzer
      POSTGRES_PASSWORD: analyzer
    volumes:
      - analyzer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ewm-network

  # ==================== ИНФРАСТРУКТУРА ====================
  discovery-server:
    build:
      context: ./infra/discovery-server
      dockerfile: Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ewm-network

  config-server:
    build:
      context: ./infra/config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - SERVER_PORT=8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_PROFILES_ACTIVE=native
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ewm-network

  gateway-server:
    build:
      context: ./infra/gateway-server
      dockerfile: Dockerfile
    container_name: gateway-server
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_started
      config-server:
        condition: service_healthy
    networks:
      - ewm-network

  # ==================== БИЗНЕС-СЕРВИСЫ ====================
  user-service:
    build:
      context: ./core/user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: on-failure
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://users-db:5432/ewm-users
      - SPRING_DATASOURCE_USERNAME=users
      - SPRING_DATASOURCE_PASSWORD=users
    depends_on:
      users-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - ewm-network

  event-service:
    build:
      context: ./core/event-service
      dockerfile: Dockerfile
    container_name: event-service
    restart: on-failure
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://events-db:5432/ewm-events
      - SPRING_DATASOURCE_USERNAME=events
      - SPRING_DATASOURCE_PASSWORD=events
    depends_on:
      events-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-service:
        condition: service_started
      request-service:
        condition: service_started
    networks:
      - ewm-network

  request-service:
    build:
      context: ./core/request-service
      dockerfile: Dockerfile
    container_name: request-service
    restart: on-failure
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://requests-db:5432/ewm-requests
      - SPRING_DATASOURCE_USERNAME=requests
      - SPRING_DATASOURCE_PASSWORD=requests
    depends_on:
      requests-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - ewm-network

  comment-service:
    build:
      context: ./core/comment-service
      dockerfile: Dockerfile
    container_name: comment-service
    restart: on-failure
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://comments-db:5432/ewm-comments
      - SPRING_DATASOURCE_USERNAME=comments
      - SPRING_DATASOURCE_PASSWORD=comments
    depends_on:
      comments-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - ewm-network

  # ==================== НОВЫЕ СЕРВИСЫ (Stats) ====================
  collector:
    profiles: [ "full" ]
    build:
      context: ./stats/collector
      dockerfile: Dockerfile
    container_name: collector
    restart: on-failure
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
    depends_on:
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - ewm-network

  aggregator:
    profiles: [ "full" ]
    build:
      context: ./stats/aggregator
      dockerfile: Dockerfile
    container_name: aggregator
    restart: on-failure
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
    depends_on:
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - ewm-network

  analyzer:
    profiles: [ "full" ]
    build:
      context: ./stats/analyzer
      dockerfile: Dockerfile
    container_name: analyzer
    restart: on-failure
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://analyzer-db:5432/ewm-analyzer
      - SPRING_DATASOURCE_USERNAME=analyzer
      - SPRING_DATASOURCE_PASSWORD=analyzer
    depends_on:
      analyzer-db:
        condition: service_healthy
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - ewm-network

volumes:
  users-db-data:
  events-db-data:
  requests-db-data:
  comments-db-data:
  analyzer-db-data:

networks:
  ewm-network:
    driver: bridge