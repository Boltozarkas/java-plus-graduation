server:
  port: 0

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: always
  datasource:
  driver-class-name: org.postgresql.Driver
  url: jdbc:postgresql://localhost:6542/ewm-stats
  username: ${SPRING_DATASOURCE_USERNAME:stat}
  password: ${SPRING_DATASOURCE_PASSWORD:stat}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true