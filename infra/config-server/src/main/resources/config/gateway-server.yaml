server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests/**

        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/admin/comments/**,/comments/**,/users/*/comments/**

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/admin/events/**,/admin/categories/**,/admin/compilations/**,/events/**,/users/*/events/**,/categories/**,/compilations/**

        - id: stats-server-hit
          uri: lb://stats-server
          predicates:
            - Path=/hit
        - id: stats-server-stats
          uri: lb://stats-server
          predicates:
            - Path=/stats