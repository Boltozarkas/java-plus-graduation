spring:
  application:
    name: analyzer
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: false
      uri: http://localhost:8888
      fail-fast: false
  datasource:
    url: jdbc:postgresql://localhost:7547/ewm-analyzer
    username: analyzer
    password: analyzer
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9092

grpc:
  server:
    port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true