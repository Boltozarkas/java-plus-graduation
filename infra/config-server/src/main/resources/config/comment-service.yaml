server:
  port: 0

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  sql:
    init:
      mode: always
  datasource:
  driver-class-name: org.postgresql.Driver
  url: jdbc:postgresql://localhost:7546/ewm-comments
  username: ${SPRING_DATASOURCE_USERNAME:comments}
  password: ${SPRING_DATASOURCE_PASSWORD:comments}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.value}
    prefer-ip-address: true