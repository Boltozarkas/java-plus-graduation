spring:
  application:
    name: collector
  config:
    import: "optional:configserver:" # <-- ОПЦИОНАЛЬНЫЙ импорт
  cloud:
    config:
      discovery:
        enabled: false
      uri: http://localhost:8888
      fail-fast: false # <-- Отключаем падение, если Config Server недоступен

  kafka:
    bootstrap-servers: localhost:9092 # <-- Переопределяем Kafka на localhost

grpc:
  server:
    port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

kafka:
  topics:
    user-actions: stats.user-actions.v1