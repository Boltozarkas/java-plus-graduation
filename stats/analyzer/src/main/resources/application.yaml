server:
  port: 0 # <-- Явно указываем случайный порт

spring:
  application:
    name: analyzer
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:7547/ewm-analyzer
    username: analyzer
    password: analyzer
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9092

grpc:
  server:
    port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

kafka:
  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1